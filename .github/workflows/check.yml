name: Check iPhone Duo stock

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apple Store pickup availability
        run: python check_stock.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRACK_ZIP: "92127"

      - name: Save tracker
        if: always()
        run: |
          git config user.name "duo-tracker"
          git config user.email "duo-tracker@users.noreply.github.com"
          git add -A tracker.csv history.csv state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Stock update" && git push)
